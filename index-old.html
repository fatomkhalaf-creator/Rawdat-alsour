<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2bfd3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="براعم السور">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>أسماء براعم روضة السور</title>
<style>
:root{--pink:#e76b9d;--pink2:#f6c7d9;--blue:#5f86b3;--navy:#294c7d;--mint:#bfe0d6;--yellow:#f5d77c;--bg:#fffafc;--card:#ffffff;--line:#eadfe6}
*{box-sizing:border-box} html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;background:linear-gradient(180deg,#fff8fb,#f1f8fc);color:var(--navy)}
.app{max-width:820px;margin:auto;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom)}
.header{padding:22px 10px 10px;text-align:center}
.badge{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);padding:7px 13px;border-radius:999px;font-size:13px;box-shadow:0 6px 20px #8c6f7b18}
.logo{font-size:42px;margin-top:8px}
h1{font-size:clamp(28px,7vw,46px);margin:5px 0 2px;line-height:1.25}
h1 b{color:var(--pink)} .subtitle{font-weight:700;color:#718198}
.card{background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:28px;padding:16px;box-shadow:0 15px 40px #49627f18;margin:14px 0}
.searchtitle{font-weight:900;margin-bottom:10px;font-size:17px}
.searchrow{display:flex;gap:9px}
#q{flex:1;border:2px solid #d9e6ef;background:#fff;border-radius:18px;padding:15px;font-size:19px;outline:none}
#q:focus{border-color:#8eb6d3;box-shadow:0 0 0 4px #8eb6d322}
.btn{border:0;border-radius:17px;padding:13px 17px;font:inherit;font-weight:900;cursor:pointer}
.primary{background:var(--pink);color:white;min-width:92px}
.result{display:none;background:linear-gradient(135deg,#fff,#fff3f8);border:2px solid #f3cada}
.result.show{display:block}
.small{font-size:13px;color:#7c8aa0} .name{font-size:clamp(23px,6vw,36px);font-weight:950;line-height:1.5;margin:4px 0 10px}
.classpill{display:inline-block;padding:9px 18px;background:#e8f5fb;border-radius:999px;font-size:22px;font-weight:950}
.options{display:grid;gap:8px;margin-top:12px}
.option{text-align:right;background:#fff;border:1px solid #e4e9ef;border-radius:14px;padding:12px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.secondary{background:#fff;color:var(--navy);border:1px solid #dfe7ee}
.admin{display:none} .admin.show{display:block}
.notice{background:#fff5d9;border:1px solid #f0d790;color:#715d26;border-radius:15px;padding:12px;font-size:14px;line-height:1.6}
.editrow{display:grid;grid-template-columns:1fr 105px;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #f0edf0}
.editrow input{width:100%;border:1px solid #d5dce4;border-radius:12px;padding:10px;font-size:16px}
.topline{display:flex;align-items:center;justify-content:space-between;gap:8px}
.counter{font-size:13px;background:#f0f6fb;padding:7px 11px;border-radius:999px}
.footer{text-align:center;color:#8996a8;padding:20px 8px 28px;font-size:13px}
@media(max-width:520px){.searchrow{flex-direction:column}.primary{width:100%}.actions{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="badge">🌸 روضة السور</div>
    <div class="logo">👑</div>
    <h1>أسماء براعم روضة السور<br><b>مستوى ثاني</b></h1>
    <div class="subtitle">وصول أسرع للفصل في بداية الدوام ✨</div>
  </header>

  <section class="card">
    <div class="searchtitle">🔎 ابحثي عن اسم الطفل</div>
    <div class="searchrow">
      <input id="q" inputmode="search" placeholder="مثال: نوف أو محمد..." autocomplete="off">
      <button class="btn primary" onclick="searchNow()">بحث</button>
    </div>
  </section>

  <section id="result" class="card result">
    <div class="small">الاسم الكامل</div>
    <div id="resultName" class="name"></div>
    <div class="small">الفصل</div>
    <div id="resultClass" class="classpill"></div>
    <div id="options" class="options"></div>
  </section>

  <section class="card">
    <div class="topline">
      <b>إدارة القائمة</b><span id="count" class="counter"></span>
    </div>
    <div class="actions">
      <button class="btn secondary" onclick="toggleAdmin()">✏️ إدخال الفصول</button>
      <button class="btn secondary" onclick="downloadBackup()">💾 نسخة احتياطية</button>
      <label class="btn secondary" style="text-align:center;cursor:pointer">📂 استرجاع نسخة
        <input type="file" accept=".json" onchange="restoreBackup(event)" hidden>
      </label>
      <button class="btn secondary" onclick="resetSearch()">🏠 الرئيسية</button>
    </div>
  </section>

  <section id="admin" class="card admin">
    <h3 style="margin:0 0 8px">إدخال فصول الأطفال</h3>
    <div class="notice">أدخلِي الفصل بجانب كل اسم مثل <b>٢/١</b> أو <b>٢/٢</b>. يحفظ البرنامج البيانات تلقائيًا على هذا الجهاز.</div>
    <div id="editor"></div>
  </section>

  <div class="footer">🌈 براعمنا… صُنّاع الغد</div>
</div>

<script>
const initial=[{"name": "أميره احمد عبيد عايش الغازي", "cls": ""}, {"name": "العنود تامر غازي هلال تامر المطيري", "cls": ""}, {"name": "تهاني محمد حسين محمد أحمد شمس الدين", "cls": ""}, {"name": "ريم مشعل سالم محمد فالح الفويضل الهاجري", "cls": ""}, {"name": "ساره محمد سالم صغير صقر الغازي", "cls": ""}, {"name": "سعود عبد الله سعود فهدشافي موطان السبيعي", "cls": ""}, {"name": "سلمان عبد الله حمد نافع الرشيدي", "cls": ""}, {"name": "سيف عبد الله عبيد سيف الرقيمي العجمي", "cls": ""}, {"name": "شيخة فرج مبارك الساهلي", "cls": ""}, {"name": "عائشة عمر محمد صالح حضرم بن خالد العجمي", "cls": ""}, {"name": "عبدالرحمن تركي حمد عبدالرحمن حمد القحطاني", "cls": ""}, {"name": "عبدالله ضاري جبر سعيد محمد عطالله البحياني", "cls": ""}, {"name": "عذراء عباده عجيل عباده سالم الشمري", "cls": ""}, {"name": "عمر احمد صادق القودري", "cls": ""}, {"name": "فايز عبيد ناصر خلف سعد الغازي", "cls": ""}, {"name": "فهد محمد مبارك سعود مبارك الغازي", "cls": ""}, {"name": "فواز صباح محمد ادهم فارس سطام العنزي", "cls": ""}, {"name": "فواز عبد الرحمن محمد سعد عايض المطيري", "cls": ""}, {"name": "لطيفة مشاري فهيد سعد مبارك صقر العجمي", "cls": ""}, {"name": "لولوه عبد الرحمن حمود عجيل عايد الشمري", "cls": ""}, {"name": "محمد عبد الله حزام جهاد شفلح جازع العنزي", "cls": ""}, {"name": "مريم خليل عبدالله خليل ابراهيم الخليل", "cls": ""}, {"name": "منال بدر عبد عواض بادي عبيد مهرش المطيري", "cls": ""}, {"name": "نوره تامر فارس عايد ذهب الشمري", "cls": ""}, {"name": "نوف مبارك سلطان مبارك سلطان مبارك العجمي", "cls": ""}, {"name": "هنادي عبد العزيز سالم ادهم فارس سطام العنزي", "cls": ""}];
let students=JSON.parse(localStorage.getItem("rawdat_alsour_v2")||"null")||initial;
const q=document.getElementById("q"), result=document.getElementById("result"), options=document.getElementById("options");
document.getElementById("count").textContent=students.length+" طفل";

function norm(s){return (s||"").trim().replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").replace(/ؤ/g,"و").replace(/ئ/g,"ي").replace(/\s+/g," ");}
function showOne(s){document.getElementById("resultName").textContent=s.name;document.getElementById("resultClass").textContent=s.cls||"الفصل غير مُدخل";options.innerHTML="";result.classList.add("show");}
function searchNow(){
 const term=norm(q.value); options.innerHTML="";
 if(!term){result.classList.remove("show");return}
 const found=students.filter(s=>norm(s.name).includes(term));
 result.classList.add("show");
 if(!found.length){document.getElementById("resultName").textContent="لم يتم العثور على الاسم";document.getElementById("resultClass").textContent="—";return}
 if(found.length===1) return showOne(found[0]);
 document.getElementById("resultName").textContent="وجدت "+found.length+" أسماء";
 document.getElementById("resultClass").textContent="اختاري الاسم";
 found.forEach(s=>{let b=document.createElement("button");b.className="option";b.innerHTML="<b>"+s.name+"</b><br><span class='small'>الفصل: "+(s.cls||"غير مُدخل")+"</span>";b.onclick=()=>showOne(s);options.appendChild(b)})
}
q.addEventListener("input",searchNow);
q.addEventListener("keydown",e=>{if(e.key==="Enter")searchNow()});

function save(){localStorage.setItem("rawdat_alsour_v2",JSON.stringify(students));}
function toggleAdmin(){let a=document.getElementById("admin");a.classList.toggle("show");if(a.classList.contains("show"))renderEditor();}
function renderEditor(){
 let ed=document.getElementById("editor"); ed.innerHTML="";
 students.forEach((s,i)=>{let r=document.createElement("div");r.className="editrow";r.innerHTML="<div><b>"+(i+1)+". "+s.name+"</b></div><input placeholder='٢/١' value='"+(s.cls||"")+"'>";r.querySelector("input").addEventListener("input",e=>{students[i].cls=e.target.value.trim();save();});ed.appendChild(r)})
}
function resetSearch(){q.value="";result.classList.remove("show");q.focus();window.scrollTo({top:0,behavior:"smooth"})}
function downloadBackup(){
 const blob=new Blob([JSON.stringify(students,null,2)],{type:"application/json;charset=utf-8"});
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="نسخة_براعم_روضة_السور.json";a.click();URL.revokeObjectURL(a.href);
}
function restoreBackup(e){
 const f=e.target.files[0]; if(!f)return; const r=new FileReader();
 r.onload=()=>{try{let data=JSON.parse(r.result);if(Array.isArray(data)){students=data;save();document.getElementById("count").textContent=students.length+" طفل";renderEditor();alert("تم استرجاع البيانات ✅")}else throw 0;}catch{alert("الملف غير صالح")}};
 r.readAsText(f);
}
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body></html>
